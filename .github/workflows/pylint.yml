name: Pylint

# Trigger on push and pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install dependencies
      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      # Step 4: Run pylint only if Python files exist
      - name: Run pylint on Python files
        shell: bash
        run: |
          FILES=$(git ls-files '*.py')
          if [ -n "$FILES" ]; then
              echo "Running pylint on: $FILES"
              pylint $FILES
          else
              echo "No Python files found. Skipping pylint."
          fi

      # Step 5: Optional: mark completion
      - name: Pylint check complete
        run: echo "DONE CHECKUP"
